exp_name: CLS_diff_mix_imagenet100
task: classification
seed: 0

data:
  dataset: ImageNet100
  root: ${DIFFDA_ROOT}/datasets
  resolution: 224
  num_classes: 100
  examples_per_class: -1

generation:
  method: DiffMix
  exp: GEN_diff_mix_imagenet100_seed0
  root_dir: ${DIFFDA_ROOT}/DiffDA-Eval/generated_images
  utilize_way: FC
  strength: 0.9
  gamma: 0.5

model:
  arch: resnet50
  weights: None

training:
  batch_size: 32
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 1e-4
  num_epochs: 100
  criterion: CrossEntropy
