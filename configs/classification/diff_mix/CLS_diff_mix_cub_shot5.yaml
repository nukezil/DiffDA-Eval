exp_name: CLS_diff_mix_cub_shot5
task: classification
seed: 0

data:
  dataset: Birds
  root: /your/path/to/datasets
  resolution: 224
  num_classes: 200
  examples_per_class: 5

generation:
  method: DiffMix
  exp:
    0: diff_mix_cub_shot5_sd15_seed0
    1: diff_mix_cub_shot5_sd15_seed1
    2: diff_mix_cub_shot5_sd15_seed2
  root_dir: /your/path/to/DiffDA-Eval/generated_images
  replace_prob: 0.3
  strength: 0.9
  gamma: 0.5

model:
  arch: resnet50
  weights: "IMAGENET1K_V1"

training:
  batch_size: 256
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  num_epochs: 128
  criterion: LabelSmoothing
