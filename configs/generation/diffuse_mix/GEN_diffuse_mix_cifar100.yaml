exp_name: GEN_diffuse_mix_cifar100
task: generation
seed: 0

data:
  dataset: CIFAR100
  root: ${DIFFDA_ROOT}/datasets
  resolution: 256
  num_classes: 100
  examples_per_class: -1

generation:
  method: DiffuseMix
  sd_model: ${DIFFDA_ROOT}/ckpts/instruct-pix2pix
  scheduler: EulerAncestral
  num_inference_steps: 100
  augment_ratio: 5
  guidance_scale: 4.0
  root_dir: ${DIFFDA_ROOT}/DiffDA-Eval/generated_images
  fractal_img_dir: ${DIFFDA_ROOT}/datasets/fractal_images
