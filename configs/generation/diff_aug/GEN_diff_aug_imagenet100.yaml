exp_name: GEN_diff_aug_imagenet100
task: generation
seed: 0

data:
  dataset: ImageNet100
  root: ${DIFFDA_ROOT}/datasets
  resolution: 512
  num_classes: 100
  examples_per_class: -1

generation:
  method: DiffAug
  sd_model: ${DIFFDA_ROOT}/ckpts/stable-diffusion-v1-5
  scheduler: DPMSolver++
  num_inference_steps: 25
  augment_ratio: 5
  strength: 0.9
  root_dir: ${DIFFDA_ROOT}/DiffDA-Eval/generated_images
  ti_embeds: ${DIFFDA_ROOT}/DiffDA-Eval/finetuned_generators/text_inversion/ImageNet100_shot-1_seed0
  db_lora_weights: ${DIFFDA_ROOT}/DiffDA-Eval/finetuned_generators/dreambooth/TEmb_ImageNet100_shot-1_seed0
